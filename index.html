<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>Dairy Flow</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#fdf6e9;--card:#fff;--tx:#1b2a3b;--mu:#7b8794;--pr:#0f3057;--ac:#f4a300;--soft:#fff0cb;--bd:#efe3c8;--rd:#d9455f;--gr:#1d9a6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1626;--card:#12263d;--tx:#eaf2f8;--mu:#93a6ba;--pr:#6fd6db;--ac:#ffbf3c;--soft:#1b3550;--bd:#23405e;--rd:#ff7b92;--gr:#47d19b}}
:root[data-theme="dark"]{--bg:#0a1626;--card:#12263d;--tx:#eaf2f8;--mu:#93a6ba;--pr:#6fd6db;--ac:#ffbf3c;--soft:#1b3550;--bd:#23405e;--rd:#ff7b92;--gr:#47d19b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b2545;z-index:10}
header{background:linear-gradient(135deg,#0b2545,#1b7f86);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header svg{width:38px;height:38px;flex:none}header b{font-size:20px;letter-spacing:.3px}header small{margin-left:auto;font-size:12px;opacity:.9;text-align:right}header i{display:block;font-style:normal;font-size:11px;color:#ffd77a}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,48,87,.06)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
.stat{background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:21px;color:var(--pr)}.stat span{font-size:12px;color:var(--mu)}
label{font-size:12px;color:var(--mu);display:block;margin:8px 0 2px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
button{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;background:linear-gradient(135deg,#0b2545,#1b7f86);color:#fff;cursor:pointer}
button.g{background:var(--soft);color:var(--pr)}button.d{background:transparent;color:var(--rd);padding:6px 8px}button.sm{padding:6px 10px;font-size:13px}button.w{width:100%;margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:9px 0;font-size:11px}nav button span{display:block;font-size:20px}nav button.on{color:var(--pr);box-shadow:inset 0 3px 0 var(--ac)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:10px}.seg button{flex:1;background:none;color:var(--pr)}.seg button.on{background:linear-gradient(135deg,#0b2545,#1b7f86);color:#fff}
.li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:6px}.li:last-child{border:0}
.mu{color:var(--mu);font-size:12px}.big{font-size:24px;font-weight:800}.rd{color:var(--rd)}.gr{color:var(--gr)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--bd)}th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}th{color:var(--mu);font-weight:600}
.q{width:62px;padding:8px 4px;text-align:center}
.wn{background:var(--soft);border:1px solid var(--ac);border-radius:12px;padding:9px;margin-top:8px;font-size:13px}.wn:empty{display:none}
#t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0b2545;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}#t.s{opacity:1}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--pr)}
</style></head><body>
<header><span id="lg"></span><div><b>Dairy Flow</b><i>Smart milk accounts</i></div><small id="dt"></small></header>
<main id="m"></main>
<nav id="nv"></nav><div id="t"></div>
<script>
var LOGO='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2545"/><stop offset="1" stop-color="#1b8a8f"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="url(#g)"/><path d="M50 15C50 15 27 42 27 58a23 23 0 0 0 46 0C73 42 50 15 50 15Z" fill="#fff8ec"/><path d="M31 60q6.5-8 13 0t13 0t13 0" stroke="#f4a300" stroke-width="5.5" stroke-linecap="round" fill="none"/><circle cx="41" cy="44" r="3.2" fill="#fff" opacity=".8"/></svg>';
var S={c:[],e:[],p:[]},tab='h',hd='',et='m',ec='',ed=null,bc='',bi=0,bf='',bt='',pend='',KEY='dairyflow_v1';
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(x){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}}
var $=function(i){return document.getElementById(i)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var pad=function(n){return String(n).padStart(2,'0')};
var fmt=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var P=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var today=function(){return fmt(new Date())};
var dsp=function(s){var d=P(s);return d.getDate()+' '+MO[d.getMonth()]+' '+String(d.getFullYear()).slice(2)};
var dm=function(s){return s.slice(8)+'/'+s.slice(5,7)};
var addD=function(s,n){var d=P(s);d.setDate(d.getDate()+n);return fmt(d)};
var rs=function(n){return '₹'+(Math.round(n*100)/100).toLocaleString('en-IN')};
var rd=function(n){return Math.round(n*100)/100};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var cust=function(id){return S.c.find(function(c){return c.id===id})};
var amt=function(e){return (e.m+e.e)*e.rate};
var sum=function(a,f){return a.reduce(function(t,x){return t+f(x)},0)};
function toast(s){var t=$('t');t.textContent=s;t.className='s';setTimeout(function(){t.className=''},2000)}
function warn(s){$('wn').innerHTML='⚠️ '+s}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function cs(c,y,m){return new Date(y,m,Math.min(P(c.start).getDate(),dim(y,m)))}
function ce(c,y,m){var n=cs(c,y,m+1);return new Date(n.getFullYear(),n.getMonth(),n.getDate()-1)}
function curIdx(c){var t=new Date(),y=t.getFullYear(),m=t.getMonth();if(t<cs(c,y,m))m--;var s=P(c.start);return Math.max(y*12+m,s.getFullYear()*12+s.getMonth())}
function setCycle(c,i){bi=i;var y=Math.floor(i/12),m=i%12;bf=fmt(cs(c,y,m));bt=fmt(ce(c,y,m))}
function bill(c,f,t){
 var es=S.e.filter(function(x){return x.cid===c.id}),ps=S.p.filter(function(x){return x.cid===c.id}),T='',note='',eff=f;
 ps.forEach(function(p){if(p.till&&p.till>T)T=p.till});
 if(T&&T>=f){var X=sum(ps.filter(function(p){return p.till===T}),function(p){return p.amt});
  if(T<t){eff=addD(T,1);note='Account is already settled till '+dsp(T)+' ('+rs(X)+' received). This bill counts from '+dsp(eff)+'.'}
  else note='Account is settled till '+dsp(T)+' ('+rs(X)+' received). This period is already paid.'}
 var key=function(p){return p.till||p.date};
 var inE=es.filter(function(x){return x.date>=eff&&x.date<=t}).sort(function(a,b){return a.date<b.date?-1:1});
 var inP=ps.filter(function(p){return key(p)>=eff&&key(p)<=t}).sort(function(a,b){return key(a)<key(b)?-1:1});
 var prev=sum(es.filter(function(x){return x.date<eff}),amt)-sum(ps.filter(function(p){return key(p)<eff}),function(p){return p.amt});
 var tm=sum(inE,function(x){return x.m}),te=sum(inE,function(x){return x.e}),a=sum(inE,amt),paid=sum(inP,function(p){return p.amt});
 return{eff:eff,note:note,inE:inE,inP:inP,prev:prev,days:Math.round((P(t)-P(eff))/864e5)+1,tm:tm,te:te,a:a,paid:paid,net:prev+a-paid}
}
function totalDue(c){return sum(S.e.filter(function(x){return x.cid===c.id}),amt)-sum(S.p.filter(function(x){return x.cid===c.id}),function(x){return x.amt})}
function opts(sel){return S.c.map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')}
function empty(){return '<div class="card" style="text-align:center">First add a customer in the <b>Customers</b> tab.<br><br><button onclick="go(\'c\')">+ Add customer</button></div>'}
function go(t){tab=t;ed=null;pend='';render()}
function render(){
 $('lg').innerHTML=LOGO;$('dt').textContent=dsp(today());
 $('nv').innerHTML=[['h','🏠','Home'],['e','✏️','Entry'],['b','🧾','Bill'],['c','👥','Customers']].map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('');
 $('m').innerHTML={h:vHome,e:vEntry,b:vBill,c:vCust}[tab]();
 window.scrollTo(0,0)
}
/* HOME */
function vHome(){
 var t=today();if(!hd||hd>t)hd=t;
 var rows=S.c.filter(function(c){return c.start<=hd}),L=0,due=0;
 S.e.forEach(function(e){if(e.date===hd)L+=e.m+e.e});S.c.forEach(function(c){due+=totalDue(c)});
 var h='<div class="row"><div class="stat"><b>'+L+' L</b><span>'+(hd===t?'Today':dsp(hd))+' milk</span></div><div class="stat"><b class="'+(due>0?'rd':'gr')+'">'+rs(due)+'</b><span>Total pending</span></div></div><div style="height:12px"></div>';
 if(!S.c.length)return h+empty();
 h+='<div class="card"><label>Date (up to today)</label><input type="date" max="'+t+'" value="'+hd+'" onchange="hd=this.value;pend=\'\';render()"><div class="mu" style="margin:8px 0 4px">Quick entry: M = Morning, E = Evening (litres)</div>';
 rows.forEach(function(c){
  var e=S.e.find(function(x){return x.cid===c.id&&x.date===hd});
  h+='<div class="li"><div style="flex:1"><b>'+esc(c.name)+'</b><div class="mu">₹'+c.rate+'/L'+(e?' · <span class="gr">✔ saved</span>':'')+'</div></div><input class="q" inputmode="decimal" id="qm'+c.id+'" placeholder="M" value="'+(e?e.m:'')+'"><input class="q" inputmode="decimal" id="qe'+c.id+'" placeholder="E" value="'+(e?e.e:'')+'"></div>'
 });
 return h+'<div id="wn" class="wn"></div><div class="row"><button class="g w" onclick="fillDef()">Fill defaults</button><button class="w" onclick="saveAll()">✔ Save all</button></div></div>'
}
function fillDef(){S.c.forEach(function(c){var a=$('qm'+c.id),b=$('qe'+c.id);if(a&&!a.value&&!b.value){a.value=c.dm||'';b.value=c.de||''}})}
function saveAll(){
 var ch=[],list=[],sig=hd;
 S.c.forEach(function(c){var a=$('qm'+c.id),b=$('qe'+c.id);if(!a||(a.value===''&&b.value===''))return;
  var m=Math.max(0,parseFloat(a.value)||0),e=Math.max(0,parseFloat(b.value)||0),x=S.e.find(function(z){return z.cid===c.id&&z.date===hd});
  list.push([c.id,m,e]);sig+=c.id+m+'/'+e;if(x&&(x.m!==m||x.e!==e))ch.push(c.name)});
 if(ch.length&&pend!==sig){pend=sig;return warn('Entry already exists for '+dsp(hd)+' ('+esc(ch.slice(0,4).join(', '))+(ch.length>4?' +more':'')+'). Tap Save all again to overwrite.')}
 list.forEach(function(l){setE(l[0],hd,l[1],l[2])});pend='';save();toast(list.length+' entries saved ✔');render()
}
function setE(cid,d,m,e){var x=S.e.find(function(z){return z.cid===cid&&z.date===d});if(x){x.m=m;x.e=e}else S.e.push({id:uid(),cid:cid,date:d,m:m,e:e,rate:cust(cid).rate})}
/* ENTRY */
function vEntry(){
 if(!S.c.length)return empty();if(!cust(ec))ec=S.c[0].id;
 var c=cust(ec),t=today(),h='<div class="seg"><button class="'+(et==='m'?'on':'')+'" onclick="et=\'m\';ed=null;render()">🥛 Milk</button><button class="'+(et==='p'?'on':'')+'" onclick="et=\'p\';ed=null;render()">💰 Payment</button></div>';
 h+='<div class="card"><label>Customer</label><select onchange="ec=this.value;ed=null;pend=\'\';render()">'+opts(ec)+'</select>';
 if(et==='m'){
  h+='<div class="row"><div><label>From date</label><input type="date" id="d1" min="'+c.start+'" max="'+t+'" value="'+t+'"></div><div><label>To date</label><input type="date" id="d2" min="'+c.start+'" max="'+t+'" value="'+t+'"></div></div>'+
  '<div class="row"><div><label>Morning M (litres)</label><input id="qm" inputmode="decimal" value="'+(c.dm||'')+'"></div><div><label>Evening E (litres)</label><input id="qe" inputmode="decimal" value="'+(c.de||'')+'"></div></div>'+
  '<div class="mu" style="margin-top:6px">For one day keep From and To the same. Pick a range to fill many days at once.</div><div id="wn" class="wn"></div><button class="w" onclick="saveM()">'+(ed?'Update entry':'Save entry')+'</button>';
  h+='</div><div class="card"><b>Recent entries</b>';
  var L=S.e.filter(function(x){return x.cid===ec}).sort(function(a,b){return a.date<b.date?1:-1}).slice(0,40);
  if(!L.length)h+='<div class="mu">No entries yet</div>';
  L.forEach(function(x){h+='<div class="li"><div><b>'+dsp(x.date)+'</b><div class="mu">M '+x.m+' · E '+x.e+' · '+(x.m+x.e)+' L · '+rs(amt(x))+'</div></div><div><button class="g sm" onclick="editE(\''+x.id+'\')">Edit</button><button class="d" onclick="del(\'e\',\''+x.id+'\',this)">Delete</button></div></div>'});
 }else{
  h+='<label>Date received</label><input type="date" id="pd" min="'+c.start+'" max="'+t+'" value="'+t+'"><label>Amount (₹)</label><input id="pa" inputmode="decimal"><label>Account settled up to (optional)</label><input type="date" id="pt" min="'+c.start+'" max="'+t+'"><div class="mu">Fill this if the payment clears the bill till a date, e.g. paid ₹600 for 10 Oct–20 Oct, set 20 Oct. Those days will not be billed again.</div><label>Note (optional)</label><input id="pn" placeholder="Cash / UPI"><button class="w" onclick="saveP()">'+(ed?'Update payment':'Add payment')+'</button></div><div class="card"><b>Payments</b>';
  var Q=S.p.filter(function(x){return x.cid===ec}).sort(function(a,b){return a.date<b.date?1:-1});
  if(!Q.length)h+='<div class="mu">No payments yet</div>';
  Q.forEach(function(x){h+='<div class="li"><div><b>'+rs(x.amt)+'</b><div class="mu">'+dsp(x.date)+(x.till?' · settled till '+dsp(x.till):'')+(x.note?' · '+esc(x.note):'')+'</div></div><div><button class="g sm" onclick="editP(\''+x.id+'\')">Edit</button><button class="d" onclick="del(\'p\',\''+x.id+'\',this)">Delete</button></div></div>'});
 }
 return h+'</div>'
}
function saveM(){
 var c=cust(ec),a=$('d1').value,b=$('d2').value,t=today();
 if(!a||!b)return toast('Select dates');if(b<a)return toast('To date is before From date');
 if(b>t)return toast('Future dates are not allowed');if(a<c.start)return toast('Date is before start date');
 var m=Math.max(0,parseFloat($('qm').value)||0),e=Math.max(0,parseFloat($('qe').value)||0);
 if(!m&&!e)return toast('Enter litres');
 var dups=[],ds=[];for(var d=P(a);fmt(d)<=b;d.setDate(d.getDate()+1)){ds.push(fmt(d));if(S.e.some(function(z){return z.cid===ec&&z.date===fmt(d)&&z.id!==ed}))dups.push(dm(fmt(d)))}
 var sig=ec+a+b+m+'/'+e+ed;
 if(dups.length&&pend!==sig){pend=sig;return warn('Entry already exists for '+dups.slice(0,5).join(', ')+(dups.length>5?' +'+(dups.length-5)+' more':'')+'. Tap again to overwrite.')}
 if(ed){var x=S.e.find(function(z){return z.id===ed});S.e=S.e.filter(function(z){return !(z.cid===ec&&z.date===a&&z.id!==ed)});x.date=a;x.m=m;x.e=e;ed=null}
 else ds.forEach(function(d){setE(ec,d,m,e)});
 pend='';save();toast('Entry saved ✔');render()
}
function editE(id){var x=S.e.find(function(z){return z.id===id});ed=id;pend='';render();$('d1').value=$('d2').value=x.date;$('qm').value=x.m;$('qe').value=x.e;window.scrollTo(0,0)}
function saveP(){
 var c=cust(ec),d=$('pd').value,a=parseFloat($('pa').value),tl=$('pt').value;
 if(!d||d>today()||d<c.start)return toast('Select a valid date');if(!(a>0))return toast('Enter amount');
 if(tl&&(tl<c.start||tl>today()))return toast('Settled-up-to date is not valid');
 if(ed){var x=S.p.find(function(z){return z.id===ed});x.date=d;x.amt=a;x.till=tl;x.note=$('pn').value;ed=null}
 else S.p.push({id:uid(),cid:ec,date:d,amt:a,till:tl,note:$('pn').value});
 save();toast('Payment saved ✔');render()
}
function editP(id){var x=S.p.find(function(z){return z.id===id});ed=id;render();$('pd').value=x.date;$('pa').value=x.amt;$('pt').value=x.till||'';$('pn').value=x.note||'';window.scrollTo(0,0)}
function del(k,id,b){
 if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='Sure?';setTimeout(function(){b.dataset.s='';b.textContent='Delete'},3000);return}
 if(k==='e')S.e=S.e.filter(function(x){return x.id!==id});else if(k==='p')S.p=S.p.filter(function(x){return x.id!==id});
 else{S.c=S.c.filter(function(x){return x.id!==id});S.e=S.e.filter(function(x){return x.cid!==id});S.p=S.p.filter(function(x){return x.cid!==id})}
 save();toast('Deleted');render()
}
/* BILL */
function vBill(){
 if(!S.c.length)return empty();if(!cust(bc)){bc=S.c[0].id;setCycle(S.c[0],curIdx(S.c[0]))}
 var c=cust(bc),s0=P(c.start),si=s0.getFullYear()*12+s0.getMonth(),b=bill(c,bf,bt);
 var h='<div class="card"><label>Customer</label><select onchange="bc=this.value;setCycle(cust(bc),curIdx(cust(bc)));render()">'+opts(bc)+'</select>'+
 '<div class="row"><div><label>Bill from</label><input type="date" min="'+c.start+'" value="'+bf+'" onchange="if(this.value){bf=this.value;if(bt<bf)bt=bf;render()}"></div><div><label>Bill to</label><input type="date" min="'+c.start+'" value="'+bt+'" onchange="if(this.value){bt=this.value;if(bf>bt)bf=bt;render()}"></div></div>'+
 '<div class="row" style="margin-top:10px"><button class="g" '+(bi<=si?'disabled style="opacity:.4"':'')+' onclick="setCycle(cust(bc),bi-1);render()">◀ Previous cycle</button><button class="g" '+(bi>=curIdx(c)?'disabled style="opacity:.4"':'')+' onclick="setCycle(cust(bc),bi+1);render()">Next cycle ▶</button></div></div>';
 if(b.note)h+='<div class="wn" style="margin:0 0 12px">⚠️ '+esc(b.note)+'</div>';
 h+='<div class="card"><b>'+esc(c.name)+'</b> <span class="mu">· ₹'+c.rate+'/L · '+dsp(b.eff)+' – '+dsp(bt)+' ('+b.days+' days)'+(bt>today()?' <span class="tag">running</span>':'')+'</span>'+
 '<div class="li"><span>Previous balance</span><b>'+rs(b.prev)+'</b></div><div class="li"><span>M '+b.tm+' L + E '+b.te+' L = <b>'+rd(b.tm+b.te)+' L</b></span><b>'+rs(b.a)+'</b></div><div class="li"><span>Received</span><b class="gr">− '+rs(b.paid)+'</b></div>'+
 '<div class="li"><span><b>Balance due</b></span><span class="big '+(b.net>0?'rd':'gr')+'">'+rs(b.net)+'</span></div>'+
 '<div class="row"><button class="w" onclick="shareB()">📲 Send on WhatsApp</button><button class="g w" onclick="copyB()">Copy</button></div></div>';
 var rows='';b.inE.forEach(function(x){[['M',x.m],['E',x.e]].forEach(function(s){if(s[1]>0)rows+='<tr><td>'+dm(x.date)+'</td><td>'+s[0]+'</td><td>'+s[1]+' × '+x.rate+'</td><td>'+rd(s[1]*x.rate)+'</td></tr>'})});
 h+='<div class="card sc"><b>Daily details</b><table><tr><th>Date</th><th>M/E</th><th>Qty × Rate</th><th>Amount</th></tr>'+(rows||'<tr><td colspan="4" class="mu">No entries in this period</td></tr>')+'</table>'+
 (b.inP.length?'<div style="margin-top:10px"><b>Payments</b>'+b.inP.map(function(x){return '<div class="li"><span>'+dsp(x.date)+(x.till?' · settled till '+dm(x.till):'')+(x.note?' · '+esc(x.note):'')+'</span><b>'+rs(x.amt)+'</b></div>'}).join('')+'</div>':'')+'</div>';
 return h
}
function txt(){
 var c=cust(bc),b=bill(c,bf,bt);
 return '🥛 *Dairy Flow – Milk Bill*\nName: '+c.name+'\nPeriod: '+dsp(b.eff)+' to '+dsp(bt)+' ('+b.days+' days)\nMorning: '+b.tm+' L | Evening: '+b.te+' L\nTotal: '+rd(b.tm+b.te)+' L @ ₹'+c.rate+'/L\nBill: '+rs(b.a)+'\nPrevious balance: '+rs(b.prev)+'\nReceived: '+rs(b.paid)+'\n*Balance due: '+rs(b.net)+'*\n'+(b.note?b.note+'\n':'')+'Thank you 🙏'
}
function shareB(){var c=cust(bc),p=(c.phone||'').replace(/\D/g,'');if(p.length===10)p='91'+p;window.open('https://wa.me/'+p+'?text='+encodeURIComponent(txt()),'_blank')}
function copyB(){try{navigator.clipboard.writeText(txt()).then(function(){toast('Bill copied')},function(){toast('Could not copy')})}catch(x){toast('Could not copy')}}
/* CUSTOMERS */
function vCust(){
 var c=ed&&cust(ed)||{},h='<div class="card"><b>'+(c.id?'Edit customer':'New customer')+'</b><label>Name</label><input id="cn" value="'+esc(c.name)+'"><div class="row"><div><label>Mobile</label><input id="cp" inputmode="tel" value="'+esc(c.phone)+'"></div><div><label>Rate ₹ per litre</label><input id="cr" inputmode="decimal" value="'+(c.rate||'')+'"></div></div>'+
 '<label>Start date (billing cycle starts on this day every month)</label><input type="date" id="cd" value="'+(c.start||today())+'"><div class="row"><div><label>Default Morning M (L)</label><input id="cm" inputmode="decimal" value="'+(c.dm||'')+'"></div><div><label>Default Evening E (L)</label><input id="ce" inputmode="decimal" value="'+(c.de||'')+'"></div></div>'+
 '<button class="w" onclick="saveC()">'+(c.id?'Update':'+ Add customer')+'</button>'+(c.id?'<button class="g w" onclick="ed=null;render()">Cancel</button>':'')+'</div><div class="card"><b>Customers ('+S.c.length+')</b>';
 S.c.forEach(function(x){var d=totalDue(x);h+='<div class="li"><div><b>'+esc(x.name)+'</b><div class="mu">Start '+dsp(x.start)+' · ₹'+x.rate+'/L · cycle from day '+P(x.start).getDate()+'</div></div><div style="text-align:right"><b class="'+(d>0?'rd':'gr')+'">'+rs(d)+'</b><br><button class="g sm" onclick="ed=\''+x.id+'\';render()">Edit</button><button class="d" onclick="del(\'c\',\''+x.id+'\',this)">Delete</button></div></div>'});
 h+='</div><div class="card"><b>Backup</b><div class="mu">Data is saved in this browser. Copy a backup now and then and keep it safe.</div><div class="row"><button class="g w" onclick="bk()">Copy backup</button><button class="g w" onclick="rs2()">Restore</button></div><textarea id="bt" rows="3" placeholder="Paste a backup here to restore" style="margin-top:8px"></textarea></div>';
 return h
}
function saveC(){
 var n=$('cn').value.trim(),r=parseFloat($('cr').value),d=$('cd').value;
 if(!n)return toast('Enter name');if(!(r>0))return toast('Enter rate');if(!d)return toast('Select start date');
 var o={name:n,phone:$('cp').value.trim(),rate:r,start:d,dm:parseFloat($('cm').value)||0,de:parseFloat($('ce').value)||0};
 if(ed&&cust(ed))Object.assign(cust(ed),o);else S.c.push(Object.assign({id:uid()},o));
 ed=null;save();toast('Saved ✔');render()
}
function bk(){var j=JSON.stringify(S);$('bt').value=j;try{navigator.clipboard.writeText(j).then(function(){toast('Backup copied')})}catch(x){toast('Copy the text manually')}}
function rs2(){try{var d=JSON.parse($('bt').value);if(!d.c||!d.e||!d.p)throw 0;S=d;save();toast('Restored');render()}catch(x){toast('Invalid backup')}}
var ic=document.createElement('link');ic.rel='icon';ic.href='data:image/svg+xml,'+encodeURIComponent(LOGO);document.head.appendChild(ic);
render();
