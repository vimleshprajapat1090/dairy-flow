 var rows=S.c.filter(function(c){return c.start<=hd}),L=0,due=0;

 var h='<div class="row"><div class="stat"><b>'+L+' L</b><span>'+(hd===t?'Today':dsp(hd))+' milk</span></div><div class="stat"><b class="'+(due>0?'rd':'gr')+'">'+rs(due)+'</b><span>Total pending</span></div></div><div style="height:12px"></div>';
 if(!S.c.length)return h+empty();h+=missCard();
 h+='<div class="card"><label>Date (up to today)</label><input type="date" max="'+t+'" value="'+hd+'" onchange="hd=this.value;pend=\'\';render()"><div class="mu" style="margin:8px 0 4px">Quick entry: M = Morning, E = Evening (litres)</div>';
 rows.forEach(function(c){
  var e=S.e.find(function(x){return x.cid===c.id&&x.date===hd});if(settledTill(c)>=hd){h+='<div class="li"><div><b>'+esc(c.name)+'</b><div class="mu">🔒 Settled till '+dsp(settledTill(c))+'</div></div></div>';return}
  h+='<div class="li"><div style="flex:1"><b>'+esc(c.name)+'</b><div class="mu">₹'+c.rate+'/L'+(e?' · <span class="gr">✔ '+(e.m+e.e?'saved':'no milk')+'</span>':'')+'</div></div><input class="q" inputmode="decimal" id="qm'+c.id+'" placeholder="M" value="'+(e?e.m:'')+'"><input class="q" inputmode="decimal" id="qe'+c.id+'" placeholder="E" value="'+(e?e.e:'')+'"></div>'
 });
 return h+'<div id="wn" class="wn"></div><div class="row"><button class="g w" onclick="fillDef()">Fill defaults</button><button class="w" onclick="saveAll()">✔ Save all</button></div></div>'

function fillDef(){S.c.forEach(function(c){var a=$('qm'+c.id),b=$('qe'+c.id);if(a&&!a.value&&!b.value){a.value=c.dm||'';b.value=c.de||''}})}
function saveAll(){
 var ch=[],list=[],sig=hd;
 S.c.forEach(function(c){var a=$('qm'+c.id),b=$('qe'+c.id);if(!a||(a.value===''&&b.value===''))return;
  var m=Math.max(0,parseFloat(a.value)||0),e=Math.max(0,parseFloat(b.value)||0),x=S.e.find(function(z){return z.cid===c.id&&z.date===hd});
  list.push([c.id,m,e]);sig+=c.id+m+'/'+e;if(x&&(x.m!==m||x.e!==e))ch.push(c.name)});
 if(ch.length&&pend!==sig){pend=sig;return warn('Entry already exists for '+dsp(hd)+' ('+esc(ch.slice(0,4).join(', '))+(ch.length>4?' +more':'')+'). Tap Save all again to overwrite.')}
 list.forEach(function(l){setE(l[0],hd,l[1],l[2])});pend='';save();toast(list.length+' entries saved ✔');render()
}
function setE(cid,d,m,e){var x=S.e.find(function(z){return z.cid===cid&&z.date===d});if(x){x.m=m;x.e=e}else S.e.push({id:uid(),cid:cid,date:d,m:m,e:e,rate:rateFor(cust(cid),d)})}

  var Q=S.p.filter(function(x){return x.cid===ec}).sort(function(a,b){return a.date<b.date?1:-1});
  if(!Q.length)h+='<div class="mu">No payments yet</div>';
  Q.forEach(function(x){h+='<div class="li"><div><b>'+rs(x.amt)+'</b><div class="mu">'+dsp(x.date)+(x.till?' · settled till '+dsp(x.till):'')+(x.note?' · '+esc(x.note):'')+'</div></div><div><button class="g sm" onclick="editP(\''+x.id+'\')">Edit</button><button class="d" onclick="del(\'p\',\''+x.id+'\',this)">Delete</button></div></div>'});

function saveM(z){
 var c=cust(ec),a=$('d1').value,b=$('d2').value,t=today();
 if(!a||!b)return toast('Select dates');if(b<a)return toast('To date is before From date');
 if(b>t)return toast('Future dates are not allowed');if(a<c.start)return toast('Date is before start date');if(a<=settledTill(c))return toast('Already settled till '+dsp(settledTill(c))+'. Remove the settled date from that payment to reopen.');
 var m=Math.max(0,parseFloat($('qm').value)||0),e=Math.max(0,parseFloat($('qe').value)||0);
 if(z){m=0;e=0}else if(!m&&!e)return toast('Enter litres, or tap Mark as no milk');
 var dups=[],ds=[];for(var d=P(a);fmt(d)<=b;d.setDate(d.getDate()+1)){ds.push(fmt(d));if(S.e.some(function(z){return z.cid===ec&&z.date===fmt(d)&&z.id!==ed}))dups.push(dm(fmt(d)))}
 var sig=ec+a+b+m+'/'+e+ed;
 if(dups.length&&pend!==sig){pend=sig;return warn('Entry already exists for '+dups.slice(0,5).join(', ')+(dups.length>5?' +'+(dups.length-5)+' more':'')+'. Tap again to overwrite.')}
 if(ed){var x=S.e.find(function(z){return z.id===ed});S.e=S.e.filter(function(z){return !(z.cid===ec&&z.date===a&&z.id!==ed)});x.date=a;x.m=m;x.e=e;ed=null}
 else ds.forEach(function(d){setE(ec,d,m,e)});
 pend='';save();toast('Entry saved ✔');render()
}
function editE(id){var x=S.e.find(function(z){return z.id===id});ed=id;pend='';render();$('d1').value=$('d2').value=x.date;$('qm').value=x.m;$('qe').value=x.e;syncDates();window.scrollTo(0,0)}
function saveP(){
 var c=cust(ec),d=$('pd').value,a=parseFloat($('pa').value),tl=$('pt').value;
 if(!d||d>today()||d<c.start)return toast('Select a valid date');if(!(a>0))return toast('Enter amount');
 if(tl&&(tl<c.start||tl>today()))return toast('Settled-up-to date is not valid');
 if(ed){var x=S.p.find(function(z){return z.id===ed});x.date=d;x.amt=a;x.till=tl;x.note=$('pn').value;ed=null}
 else S.p.push({id:uid(),cid:ec,date:d,amt:a,till:tl,note:$('pn').value});
 save();toast('Payment saved ✔');render()
}
function editP(id){var x=S.p.find(function(z){return z.id===id});ed=id;render();$('pd').value=x.date;$('pa').value=x.amt;$('pt').value=x.till||'';$('pn').value=x.note||'';syncDates();window.scrollTo(0,0)}
function del(k,id,b){
 if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='Sure?';setTimeout(function(){b.dataset.s='';b.textContent='Delete'},3000);return}
 if(k==='x')S.x=S.x.filter(function(x){return x.id!==id});else if(k==='i')S.i=S.i.filter(function(x){return x.id!==id});else if(k==='e')S.e=S.e.filter(function(x){return x.id!==id});else if(k==='p')S.p=S.p.filter(function(x){return x.id!==id});
 else{S.c=S.c.filter(function(x){return x.id!==id});S.x=S.x.filter(function(x){return x.cid!==id});S.e=S.e.filter(function(x){return x.cid!==id});S.p=S.p.filter(function(x){return x.cid!==id})}
 save();toast('Deleted');render()
}

function saveC(){
 var n=$('cn').value.trim(),r=parseFloat($('cr').value),d=$('cd').value;
 if(!n)return toast('Enter name');if(!(r>0))return toast('Enter rate');if(!d)return toast('Select start date');
 var o={name:n,phone:$('cp').value.trim(),rate:r,start:d,dm:parseFloat($('cm').value)||0,de:parseFloat($('ce').value)||0};
 if(ed&&cust(ed)){var c0=cust(ed),old=c0.rate,ef=($('cf')&&$('cf').value)||today();if(r!==old&&ef<=settledTill(c0))return toast('Rate cannot change inside a settled period');delete o.rate;Object.assign(c0,o);if(r!==old){if(!c0.rates)c0.rates=[{from:c0.start,rate:old}];c0.rates=c0.rates.filter(function(z){return z.from!==ef});c0.rates.push({from:ef,rate:r});c0.rate=rateFor(c0,today());S.e.forEach(function(x){if(x.cid===c0.id&&x.date>=ef)x.rate=rateFor(c0,x.date)})}}else S.c.push(Object.assign({id:uid(),rates:[{from:d,rate:r}]},o));
 ed=null;save();toast('Saved ✔');render()
}
